# Warm pool on hub host (box1). Orchestrator + chrome-min for UI WARM + hub-attach.
# Hub: -warm-pool-url http://127.0.0.1:9090
#
# Loopback WD ports are published on the host only (127.0.0.1:14441/14442).
# Hub POST /pool/reserve {loopback:true} gets webdriverUrlLoopback → attach.
# docker-DNS webdriver_url stays for in-network clients (not used by host hub).
# min image has no warm-api (8080); /pool/release reset is best-effort.

slots:
  - id: pool-chrome-1
    protocol: webdriver
    browser: chrome
    session_id: pool-chrome-1
    warm_url: http://warm-chrome-1:4444
    webdriver_url: http://warm-chrome-1:4444/
    webdriver_url_loopback: http://127.0.0.1:14441/

  - id: pool-chrome-2
    protocol: webdriver
    browser: chrome
    session_id: pool-chrome-2
    warm_url: http://warm-chrome-2:4444
    webdriver_url: http://warm-chrome-2:4444/
    webdriver_url_loopback: http://127.0.0.1:14442/
