# Warm 4/4 + hot 2 WD + 1 PW + 5 CDP (Go mill) on hub host (box1). Orchestrator + slots for UI WARM/HOT + container-reuse.
# Hub: -warm-pool-url http://127.0.0.1:9090
#
# Chrome WD container-reuse (loopback): headed 14441 first, then 149-min 14442 (shm 2g).
# Playwright warm slots are up; hub PW remains cold (ADR). Loopback WS is for window 03.
# Hot slots (pool: hot) are listed for metrics; container-reuse available() skips them.
# Do not preopen /login on these slots.

slots:
  - id: pool-chrome-1
    protocol: webdriver
    browser: chrome
    session_id: pool-chrome-1
    warm_url: http://warm-chrome-1:4444
    webdriver_url: http://warm-chrome-1:4444/
    webdriver_url_loopback: http://127.0.0.1:14441/

  - id: pool-chrome-2
    protocol: webdriver
    browser: chrome
    session_id: pool-chrome-2
    warm_url: http://warm-chrome-2:4444
    webdriver_url: http://warm-chrome-2:4444/
    webdriver_url_loopback: http://127.0.0.1:14442/

  - id: pool-pw-chromium-1
    protocol: playwright
    browser: chromium
    session_id: pool-pw-chromium-1
    warm_url: http://warm-pw-1:3000
    playwright_ws_url: ws://warm-pw-1:3000/
    playwright_ws_url_loopback: ws://127.0.0.1:14501/

  - id: pool-pw-chromium-min-1
