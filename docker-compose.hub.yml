# Warm pool next to Selenoid hub (box1-selenoid).
# Hub binary on host: -warm-pool-url http://127.0.0.1:9090
#
# Warm 4/4 (container-reuse = New Session on an already-up container):
#   WD headed  14441  qaguru/webdriver-chrome:152         (hub catalog default)
#   WD headed  14442  qaguru/webdriver-chrome:152         (152-min cannot start Chrome on Box1)
#   PW headed  14501  qaguru/playwright-chromium:1.63.0
#   PW min     14502  qaguru/playwright-chromium:1.63.0-min
#
# Container-reuse client is Chrome WD only (ADR). Headed 14441 stays first in
# config so job #14 prefers it. Slots must not idle on /login.
#
#   docker compose -f docker-compose.hub.yml up -d
# Project name matches the repo. Network `selenoid-reuse` is warm+hot sidecar L2
# (container-reuse and session-reuse). Orchestrator DNS is container_name
# `selenoid-pool`. Cold hub browsers stay on network `selenoid`.
name: selenoid-pool
services:
  warm-chrome-1:
    image: qaguru/webdriver-chrome:152
    container_name: warm-chrome-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-chrome-1
      WARM_SESSION_ID: pool-chrome-1
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:14441:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-reuse

  warm-chrome-2:
    image: qaguru/webdriver-chrome:152
    container_name: warm-chrome-2
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-chrome-2
      WARM_SESSION_ID: pool-chrome-2
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:14442:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-reuse

  warm-pw-1:
    image: qaguru/playwright-chromium:1.63.0
    container_name: warm-pw-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-pw-chromium-1
      WARM_SESSION_ID: pool-pw-chromium-1
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:14501:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-reuse

  warm-pw-min-1:
    image: qaguru/playwright-chromium:1.63.0-min
    container_name: warm-pw-min-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-pw-chromium-min-1
      WARM_SESSION_ID: pool-pw-chromium-min-1
    ports:
      - "127.0.0.1:14502:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-reuse

  orchestrator:
    build: .
    image: qaguru/selenoid-pool:min
    container_name: selenoid-pool
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      WARM_POOL_CONFIG: /config/config.yaml
      WARM_POOL_HOST: "0.0.0.0"
      WARM_POOL_PORT: "9090"
    volumes:
      - ./config.hub.yaml:/config/config.yaml:ro
    networks:
      - selenoid-reuse
    depends_on:
      - warm-chrome-1
      - warm-chrome-2
      - warm-pw-1
      - warm-pw-min-1

networks:
  selenoid-reuse:
    name: selenoid-reuse
    driver: bridge
