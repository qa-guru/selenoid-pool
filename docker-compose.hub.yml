# Warm pool next to Selenoid hub (box1-selenoid).
# Hub binary on host: -warm-pool-url http://127.0.0.1:9090
#
# Warm 4/4 (container-reuse = New Session on an already-up container):
#   WD headed  14441  qaguru/webdriver-chrome:149
#   WD min     14442  qaguru/webdriver-chrome:149-min   (shm 2g, not 256m)
#   PW headed  14501  qaguru/playwright-chromium:1.61.1
#   PW min     14502  qaguru/playwright-chromium:1.61.1-min
#
# Container-reuse client is Chrome WD only (ADR). Headed 14441 stays first in
# config so job #14 prefers it. Slots must not idle on /login.
#
#   docker compose -f docker-compose.hub.yml up -d
# Project name is pinned so the host dir can be /home/qaguru/selenoid-pool
# without forking a second compose project.
name: selenoid-warm-pool
services:
  warm-chrome-1:
    image: qaguru/webdriver-chrome:149
    container_name: warm-chrome-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-chrome-1
      WARM_SESSION_ID: pool-chrome-1
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:14441:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  warm-chrome-2:
    image: qaguru/webdriver-chrome:149-min
    container_name: warm-chrome-2
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-chrome-2
      WARM_SESSION_ID: pool-chrome-2
    ports:
      - "127.0.0.1:14442:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  warm-pw-1:
    image: qaguru/playwright-chromium:1.61.1
    container_name: warm-pw-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-pw-chromium-1
      WARM_SESSION_ID: pool-pw-chromium-1
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:14501:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  warm-pw-min-1:
    image: qaguru/playwright-chromium:1.61.1-min
    container_name: warm-pw-min-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-pw-chromium-min-1
      WARM_SESSION_ID: pool-pw-chromium-min-1
    ports:
      - "127.0.0.1:14502:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  orchestrator:
    build: .
    image: qaguru/selenoid-pool:min
    container_name: selenoid-pool
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      WARM_POOL_CONFIG: /config/config.yaml
      WARM_POOL_HOST: "0.0.0.0"
      WARM_POOL_PORT: "9090"
    volumes:
      - ./config.hub.yaml:/config/config.yaml:ro
    networks:
      selenoid-warm:
        aliases:
          - selenoid-warm-pool
    depends_on:
      - warm-chrome-1
      - warm-chrome-2
      - warm-pw-1
      - warm-pw-min-1

networks:
  selenoid-warm:
    name: selenoid-warm
    driver: bridge
