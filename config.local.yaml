# Local host-side orchestrator (stand :9090). Ports published from slot containers.
# Warm 4/4 + hot 4/4. Do not idle /login. Container-reuse WD uses 14441 (headed) then 14442 (min).
# Hot CDP: protocol=cdp → cdpUrl. warm_url required by loadPool; do not call /warm/*.

slots:
  - id: pool-chrome-1
    protocol: webdriver
    browser: chrome
    session_id: pool-chrome-1
    warm_url: http://127.0.0.1:14441
    webdriver_url: http://127.0.0.1:14441/
    webdriver_url_loopback: http://127.0.0.1:14441/

  - id: pool-chrome-2
    protocol: webdriver
    browser: chrome
    session_id: pool-chrome-2
    warm_url: http://127.0.0.1:14442
    webdriver_url: http://127.0.0.1:14442/
    webdriver_url_loopback: http://127.0.0.1:14442/

  - id: pool-pw-chromium-1
    protocol: playwright
    browser: chromium
    session_id: pool-pw-chromium-1
    warm_url: http://127.0.0.1:14501
    playwright_ws_url: ws://127.0.0.1:14501/
    playwright_ws_url_loopback: ws://127.0.0.1:14501/

  - id: pool-pw-chromium-min-1
    protocol: playwright
    browser: chromium
    session_id: pool-pw-chromium-min-1
    warm_url: http://127.0.0.1:14502
    playwright_ws_url: ws://127.0.0.1:14502/
    playwright_ws_url_loopback: ws://127.0.0.1:14502/

  - id: pool-hot-chrome-min-1
    protocol: webdriver
    browser: chrome
    pool: hot
    session_id: pool-hot-chrome-min-1
    warm_url: http://127.0.0.1:16440
    webdriver_url: http://127.0.0.1:16440/
    webdriver_url_loopback: http://127.0.0.1:16440/

  - id: pool-hot-chrome-min-2
    protocol: webdriver
    browser: chrome
    pool: hot
    session_id: pool-hot-chrome-min-2
    warm_url: http://127.0.0.1:16442
    webdriver_url: http://127.0.0.1:16442/
    webdriver_url_loopback: http://127.0.0.1:16442/

  - id: pool-hot-pw-min-1
    protocol: playwright
    browser: chromium
    pool: hot
    session_id: pool-hot-pw-min-1
    warm_url: http://127.0.0.1:16441
    playwright_ws_url: ws://127.0.0.1:16441/
    playwright_ws_url_loopback: ws://127.0.0.1:16441/

  - id: pool-hot-cdp-min-1
    protocol: cdp
    browser: chromium
    pool: hot
    session_id: pool-hot-cdp-min-1
    warm_url: http://127.0.0.1:16443
    cdp_url: http://127.0.0.1:16443/
    cdp_url_loopback: http://127.0.0.1:16443/
