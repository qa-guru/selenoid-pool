# Local 2-slot warm pool: Chrome nodes + host-published ports.
# Orchestrator runs on the host: ./selenoid-warm-pool --config config.local.yaml --host 127.0.0.1 --port 9090
services:
  warm-chrome-1:
    image: qaguru/webdriver-chrome:148
    platform: linux/arm64
    container_name: warm-chrome-1
    environment:
      WARM_SLOT_ID: pool-chrome-1
      WARM_SESSION_ID: pool-chrome-1
      ENABLE_VNC: "true"
    ports:
      - "14441:4444"
      - "15901:5900"
      - "18081:8080"
    volumes:
      - ./video:/data/video
    shm_size: "512m"

  warm-chrome-2:
    image: qaguru/webdriver-chrome:148
    platform: linux/arm64
    container_name: warm-chrome-2
    environment:
      WARM_SLOT_ID: pool-chrome-2
      WARM_SESSION_ID: pool-chrome-2
      ENABLE_VNC: "true"
    ports:
      - "14442:4444"
      - "15902:5900"
      - "18082:8080"
    volumes:
      - ./video:/data/video
    shm_size: "512m"
