      WARM_SLOT_ID: pool-hot-cdp-min-2
      WARM_SESSION_ID: pool-hot-cdp-min-2
    ports:
      - "127.0.0.1:16444:9223"
    volumes:
      - ./hot-cdp/cdpproxy.pl:/tmp/cdpproxy.pl:ro
      - ./hot-cdp/hot-cdp-entrypoint.sh:/tmp/hot-cdp-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/tmp/hot-cdp-entrypoint.sh"]
    healthcheck:
      disable: true
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-reuse

  hot-cdp-min-3:
