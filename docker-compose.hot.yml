# Hot 4/4 — separate from warm container-reuse.
# Host ports 16440+ : WD min 16440, PW min 16441, WD headed 16442, PW headed 16443.
# Do not publish 14441/14442 (warm WD) or 14501/14502 (warm PW).
# Min slots stay for Java none (#55). Headed 149 / PW full = VNC twins, not hub video.
# Session lease is POST /pool/lease (bypasses the hub). Do not --stop the :9090 orchestrator.
# docker compose up -d hot-chrome-1 hot-pw-1 must not recreate hot-chrome-min-1.
#
# Project name is not the directory default: `docker compose -f docker-compose.hot.yml up`
# must not reconcile/remove warm services from docker-compose.hub.yml.
# Network selenoid-warm comes from hub compose (external).
#
#   docker compose -f docker-compose.hot.yml up -d
name: selenoid-hot
services:
  hot-chrome-min-1:
    image: qaguru/webdriver-chrome:149-min
    container_name: hot-chrome-min-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-hot-chrome-min-1
      WARM_SESSION_ID: pool-hot-chrome-min-1
    ports:
      - "127.0.0.1:16440:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  hot-pw-min-1:
    image: qaguru/playwright-chromium:1.61.1-min
    container_name: hot-pw-min-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-hot-pw-min-1
      WARM_SESSION_ID: pool-hot-pw-min-1
    ports:
      - "127.0.0.1:16441:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  hot-chrome-1:
    image: qaguru/webdriver-chrome:149
    container_name: hot-chrome-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-hot-chrome-1
      WARM_SESSION_ID: pool-hot-chrome-1
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:16442:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  hot-pw-1:
    image: qaguru/playwright-chromium:1.61.1
    container_name: hot-pw-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-hot-pw-1
      WARM_SESSION_ID: pool-hot-pw-1
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:16443:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

networks:
  selenoid-warm:
    name: selenoid-warm
    external: true
