# Hot 4/4 slots for the host orchestrator (stand :9090).
# Merge into config.local.yaml (already includes these ids).
# Ports 16440 (WD min) / 16441 (PW min) / 16442 (WD headed) / 16443 (PW headed).
# ≠ warm 14441/14442/14501/14502.
# Lease: POST /pool/lease (keep UUID on release unless killSession).

slots:
  - id: pool-hot-chrome-min-1
    protocol: webdriver
    browser: chrome
    pool: hot
    session_id: pool-hot-chrome-min-1
    warm_url: http://127.0.0.1:16440
    webdriver_url: http://127.0.0.1:16440/
    webdriver_url_loopback: http://127.0.0.1:16440/

  - id: pool-hot-pw-min-1
    protocol: playwright
    browser: chromium
    pool: hot
    session_id: pool-hot-pw-min-1
    warm_url: http://127.0.0.1:16441
    playwright_ws_url: ws://127.0.0.1:16441/

  - id: pool-hot-chrome-1
    protocol: webdriver
    browser: chrome
    pool: hot
    session_id: pool-hot-chrome-1
    warm_url: http://127.0.0.1:16442
    webdriver_url: http://127.0.0.1:16442/
    webdriver_url_loopback: http://127.0.0.1:16442/

  - id: pool-hot-pw-1
    protocol: playwright
    browser: chromium
    pool: hot
    session_id: pool-hot-pw-1
    warm_url: http://127.0.0.1:16443
    playwright_ws_url: ws://127.0.0.1:16443/
    playwright_ws_url_loopback: ws://127.0.0.1:16443/
