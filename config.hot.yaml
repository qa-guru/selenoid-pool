# Hot slots: 2 WD + 1 PW + 5 CDP (Go mill) for the host orchestrator (stand :9090).
# Merge into config.local.yaml (already includes these ids).
# Ports 16440 (WD Java) / 16442 (WD Python) / 16441 (PW) / 16443–16447 (CDP). ≠ warm 14441/14442/14501/14502.
# Lease: POST /pool/lease (keep UUID on release unless killSession).
# CDP: protocol=cdp → cdpUrl (HTTP DevTools). warm_url is required by loadPool; do not call /warm/*.

slots:
  - id: pool-hot-chrome-min-1
    protocol: webdriver
    browser: chrome
    pool: hot
    session_id: pool-hot-chrome-min-1
    warm_url: http://127.0.0.1:16440
    webdriver_url: http://127.0.0.1:16440/
    webdriver_url_loopback: http://127.0.0.1:16440/

  - id: pool-hot-chrome-min-2
