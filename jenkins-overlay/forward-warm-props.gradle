// Forward reuse-session -D* into the test JVM. Do not drop into stacks/.
gradle.projectsLoaded {
  rootProject.allprojects {
    tasks.withType(Test).configureEach {
      ['warm.sessionId', 'skipOpen', 'remoteUrl', 'closeBrowserAfterEach', 'closeBrowserAfterAll'].each { k ->
        def v = System.getProperty(k)
        if (v != null) {
          systemProperty k, v
        }
      }
      outputs.upToDateWhen { false }
    }
  }
}
