// Init script: forward warm -D* into the test JVM and never UP-TO-DATE the Test task.
gradle.projectsLoaded {
  rootProject.allprojects {
    tasks.withType(Test).configureEach {
      [
        'warm.sessionId',
        'skipOpen',
        'remoteUrl',
        'closeBrowserAfterEach',
        'closeBrowserAfterAll',
        'allureReportMode',
        'enableHar',
        'enableVideo',
        'enableVnc',
      ].each { k ->
        def v = System.getProperty(k)
        if (v != null) {
          systemProperty k, v
        }
      }
      outputs.upToDateWhen { false }
    }
  }
}
