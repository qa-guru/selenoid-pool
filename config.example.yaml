# Example pool config — point warm_url at running slot containers.
#
# Lease + recycle knobs (all optional):
#   lease_ttl              default reservation lifetime (default "1h"); the
#                          reaper frees expired leases every 15s
#   max_lease_ttl          clamp for per-request ttlSec (default "6h")
#   recycle_after_sessions restart a free warm container after N sessions (0=off)
#   recycle_after_age      restart a free warm container older than this (0=off)
# Recycle needs the docker socket mounted on the orchestrator and resolves the
# container name from `container:` or the non-loopback warm_url host.

video_dir: /opt/selenoid/video

slots:
  - id: pool-chrome-1
    protocol: webdriver
    browser: chrome
    session_id: pool-chrome-1
    warm_url: http://warm-chrome-1:8080
    webdriver_url: http://warm-chrome-1:4444/wd/hub
    webdriver_url_loopback: http://127.0.0.1:14441/

  - id: pool-chrome-2
    protocol: webdriver
    browser: chrome
    session_id: pool-chrome-2
    warm_url: http://warm-chrome-2:8080
    webdriver_url: http://warm-chrome-2:4444/wd/hub
    webdriver_url_loopback: http://127.0.0.1:14442/

  - id: pool-pw-chromium-1
    protocol: playwright
    browser: chromium
    session_id: pool-pw-chromium-1
    warm_url: http://warm-pw-chromium-1:8080
    playwright_ws_url: ws://warm-pw-chromium-1:3000/
    playwright_ws_url_loopback: ws://127.0.0.1:14501/

  - id: pool-pw-chromium-min-1
    protocol: playwright
    browser: chromium
    session_id: pool-pw-chromium-min-1
    warm_url: http://warm-pw-chromium-min-1:8080
    playwright_ws_url: ws://warm-pw-chromium-min-1:3000/
    playwright_ws_url_loopback: ws://127.0.0.1:14502/
